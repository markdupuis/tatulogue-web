name = "tatulogue-web"
account_id = "c624942c3c98348d062163c179846323"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.js"

routes = [
  { pattern = "tatulogue.com", custom_domain = true },
  { pattern = "www.tatulogue.com", custom_domain = true }
]

# next build (output: export) puts static files in ./out. The worker
# (src/worker.js) intercepts /get/:code for affiliate attribution and
# falls through to these static assets for everything else.
[assets]
directory = "./out"
binding = "ASSETS"
